<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCHPUCH Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            background: linear-gradient(to right, #00f3ff, #7a0cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        input[type="password"], input[type="text"], textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input[type="password"]:focus, input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00f3ff;
            box-shadow: 0 0 0 3px rgba(0, 243, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            background: linear-gradient(to right, #00f3ff, #7a0cff);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 243, 255, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 243, 255, 0.6);
        }
        button:active {
            transform: translateY(0);
        }
        .secondary-btn {
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: #333;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }
        .secondary-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.6);
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-group button {
            flex: 1;
        }
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .status-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #90ee90;
        }
        .status-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #ff6b6b;
        }
        .status-info {
            background: rgba(23, 162, 184, 0.2);
            border: 1px solid rgba(23, 162, 184, 0.5);
            color: #87ceeb;
        }
        .product-form {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
        }
        .product-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00f3ff;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .product-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .product-card h3 {
            margin-bottom: 15px;
            color: #00f3ff;
        }
        .product-card p {
            margin-bottom: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .product-card .price {
            font-weight: 600;
            font-size: 1.2rem;
            color: #ffd700;
            margin: 10px 0;
        }
        .product-card button {
            width: auto;
            padding: 8px 16px;
            font-size: 0.9rem;
            margin: 5px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            flex: 1;
            text-align: left;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .welcome-text {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
            font-style: italic;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .tab-btn:hover {
            color: white;
            background: rgba(0, 0, 0, 0.3);
        }
        .tab-btn.active {
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.1);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(to right, #00f3ff, #7a0cff);
            transition: width 0.5s ease;
        }
        .tab-btn.active:hover::after {
            width: 100%;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logout-btn {
            background: linear-gradient(to right, #ff6b6b, #ff8e8e);
            margin-top: 30px;
        }
        .logout-btn:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .btn-group {
                flex-direction: column;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header h1 {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="adminContainer">
        <div class="header">
            <h1>LUCHPUCH Admin</h1>
            <button class="nav-btn" onclick="window.location.href='../index.html'">← Visit Store</button>
        </div>

        <div class="welcome-text">
            Secure Admin Panel - Access Restricted
        </div>

        <div id="authSection">
            <div class="form-group">
                <label for="adminKey">Admin Access Key</label>
                <input type="password" id="adminKey" placeholder="Enter admin key" autocomplete="off">
            </div>
            <button id="loginBtn">Login to Admin Panel</button>
            <div class="status-message" id="authStatus"></div>
        </div>

        <div id="adminSection" style="display: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('products')">Products</button>
                <button class="tab-btn" onclick="showTab('data')">Data Management</button>
                <button class="tab-btn" onclick="showTab('orders')">Orders</button>
            </div>

            <div id="productsTab" class="tab-content active">
                <div class="product-form">
                    <h2>Add New Product</h2>
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" placeholder="e.g., Luchi Graphic Tee">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price ($)</label>
                        <input type="number" id="productPrice" placeholder="e.g., 29.99" step="0.01" min="0">
                    </div>
                    <div class="form-group">
                        <label for="productMood">Mood/Theme</label>
                        <select id="productMood">
                            <option value="">Select Mood</option>
                            <option value="chill">Chill</option>
                            <option value="hype">Hype</option>
                            <option value="lazy">Lazy</option>
                            <option value="playful">Playful</option>
                            <option value="focused">Focused</option>
                            <option value="dreamy">Dreamy</option>
                            <option value="energetic">Energetic</option>
                            <option value="calm">Calm</option>
                            <option value="mysterious">Mysterious</option>
                            <option value="joyful">Joyful</option>
                            <option value="bold">Bold</option>
                            <option value="serene">Serene</option>
                            <option value="vibrant">Vibrant</option>
                            <option value="peaceful">Peaceful</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" placeholder="Brief product description..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Image URL</label>
                        <input type="text" id="productImage" placeholder="https://example.com/image.jpg">
                    </div>
                    <button id="addProductBtn">Add Product</button>
                </div>

                <div class="product-grid" id="productGrid">
                    <!-- Products will be loaded here -->
                </div>

                <button class="secondary-btn" onclick="loadProducts()">Refresh Product List</button>
            </div>

            <div id="dataTab" class="tab-content">
                <h2>Data Management</h2>
                <div class="form-group">
                    <button onclick="exportProducts()" class="secondary-btn">Export Products (JSON)</button>
                </div>
                <div class="form-group">
                    <input type="file" id="importFile" accept=".json">
                    <button onclick="importProducts()" class="secondary-btn">Import Products (JSON)</button>
                </div>
                <div class="form-group">
                    <button onclick="clearAllProducts()" class="secondary-btn" style="background: linear-gradient(to right, #ff6b6b, #ff8e8e);">
                        Clear All Products
                    </button>
                </div>
                <div class="status-message" id="dataStatus"></div>
            </div>

            <div id="ordersTab" class="tab-content">
                <h2>Recent Orders</h2>
                <div class="status-message" id="ordersStatus">Loading orders...</div>
                <div id="ordersGrid">
                    <!-- Orders will be loaded here -->
                </div>
                <button class="secondary-btn" onclick="loadOrders()">Refresh Orders</button>
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="footer">
            LUCHPUCH Admin Panel • Secure Access Only
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'https://epecmbcjaxpjyvwffxxf.supabase.co/functions/v1';
        const ADMIN_KEY = 'luchpuch2026'; // Default - will be overridden by environment in production

        // State
        let currentAdminKey = 'luchpuch2026';
        let products = [];

        // DOM Elements
        const authSection = document.getElementById('authSection');
        const adminSection = document.getElementById('adminSection');
        const loginBtn = document.getElementById('loginBtn');
        const adminKeyInput = document.getElementById('adminKey');
        const authStatus = document.getElementById('authStatus');

        const productNameInput = document.getElementById('productName');
        const productPriceInput = document.getElementById('productPrice');
        const productMoodInput = document.getElementById('productMood');
        const productDescriptionInput = document.getElementById('productDescription');
        const productImageInput = document.getElementById('productImage');
        const addProductBtn = document.getElementById('addProductBtn');
        const productGrid = document.getElementById('productGrid');

        const dataStatus = document.getElementById('dataStatus');
        const ordersStatus = document.getElementById('ordersStatus');
        const ordersGrid = document.getElementById('ordersGrid');

        // Initialize
        function init() {
            // Check if we have a stored admin key (from sessionStorage)
            const storedKey = sessionStorage.getItem('luchpuch:admin_key');
            if (storedKey) {
                currentAdminKey = storedKey;
                adminKeyInput.value = storedKey;
                loginAdmin(); // Auto-login if we have a key
            }

            // Add event listeners
            loginBtn.addEventListener('click', loginAdmin);
            adminKeyInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginAdmin();
            });
            addProductBtn.addEventListener('click', addProduct);

            // Load initial data if already logged in
            if (currentAdminKey) {
                loadProducts();
            }
        }

        // Authentication
        function loginAdmin() {
            const key = adminKeyInput.value.trim();
            if (!key) {
                showStatus(authStatus, 'Please enter admin key', 'error');
                return;
            }

            // Validate admin key by calling admin-check function
            fetch(`${API_BASE}/admin-check`, {
                method: 'GET',
                headers: {
                    'x-admin-key': key,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    currentAdminKey = key;
                    sessionStorage.setItem('luchpuch:admin_key', key);
                    authSection.style.display = 'none';
                    adminSection.style.display = 'block';
                    showStatus(authStatus, 'Login successful!', 'success');
                    loadProducts();
                    loadOrders();
                } else {
                    showStatus(authStatus, 'Invalid admin key', 'error');
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                showStatus(authStatus, 'Connection error', 'error');
            });
        }

        function logout() {
            currentAdminKey = '';
            sessionStorage.removeItem('luchpuch:admin_key');
            adminSection.style.display = 'none';
            authSection.style.display = 'block';
            adminKeyInput.value = '';
            showStatus(authStatus, 'Logged out successfully', 'info');
        }

        // Product Management
        function loadProducts() {
            if (!currentAdminKey) return;

            fetch(`${API_BASE}/products`, {
                method: 'GET',
                headers: {
                    'x-admin-key': currentAdminKey
                }
            })
            .then(response => response.json())
            .then(data => {
                products = data;
                renderProductGrid();
            })
            .catch(error => {
                console.error('Error loading products:', error);
                showStatus(dataStatus, 'Error loading products', 'error');
            });
        }

        function renderProductGrid() {
            if (products.length === 0) {
                productGrid.innerHTML = '<p>No products found. Add some products to get started.</p>';
                return;
            }

            productGrid.innerHTML = products.map(product => `
                <div class="product-card">
                    <h3>${product.name || 'Unnamed Product'}</h3>
                    <p><strong>Mood:</strong> ${product.mood || 'N/A'}</p>
                    <p><strong>Price:</strong> $${product.price ? parseFloat(product.price).toFixed(2) : '0.00'}</p>
                    <p>${product.description || 'No description'}</p>
                    ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}" style="max-width: 100%; border-radius: 10px; margin: 10px 0;">` : ''}
                    <div>
                        <button onclick="editProduct('${product.id}')" class="secondary-btn">Edit</button>
                        <button onclick="deleteProduct('${product.id}')" style="background: linear-gradient(to right, #ff6b6b, #ff8e8e);">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function addProduct() {
            const name = productNameInput.value.trim();
            const price = parseFloat(productPriceInput.value);
            const mood = productMoodInput.value;
            const description = productDescriptionInput.value.trim();
            const imageUrl = productImageInput.value.trim();

            if (!name || isNaN(price) || price <= 0) {
                showStatus(dataStatus, 'Please enter valid product name and price', 'error');
                return;
            }

            const productData = {
                name,
                price,
                mood: mood || null,
                description: description || null,
                image_url: imageUrl || null
            };

            fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': currentAdminKey
                },
                body: JSON.stringify([productData]) // API expects array
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    showStatus(dataStatus, 'Product added successfully!', 'success');
                    // Clear form
                    productNameInput.value = '';
                    productPriceInput.value = '';
                    productMoodInput.value = '';
                    productDescriptionInput.value = '';
                    productImageInput.value = '';
                    // Reload products
                    loadProducts();
                } else {
                    showStatus(dataStatus, 'Error adding product', 'error');
                }
            })
            .catch(error => {
                console.error('Error adding product:', error);
                showStatus(dataStatus, 'Connection error', 'error');
            });
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            productNameInput.value = product.name || '';
            productPriceInput.value = product.price || '';
            productMoodInput.value = product.mood || '';
            productDescriptionInput.value = product.description || '';
            productImageInput.value = product.image_url || '';

            // Change button text and behavior
            const originalText = addProductBtn.textContent;
            addProductBtn.textContent = 'Update Product';
            addProductBtn.onclick = () => updateProduct(id, originalText);

            // Scroll to form
            document.querySelector('.product-form').scrollIntoView({ behavior: 'smooth' });
        }

        function updateProduct(id, originalButtonText) {
            const name = productNameInput.value.trim();
            const price = parseFloat(productPriceInput.value);
            const mood = productMoodInput.value;
            const description = productDescriptionInput.value.trim();
            const imageUrl = productImageInput.value.trim();

            if (!name || isNaN(price) || price <= 0) {
                showStatus(dataStatus, 'Please enter valid product name and price', 'error');
                return;
            }

            const productData = {
                id,
                name,
                price,
                mood: mood || null,
                description: description || null,
                image_url: imageUrl || null
            };

            fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': currentAdminKey
                },
                body: JSON.stringify([productData])
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    showStatus(dataStatus, 'Product updated successfully!', 'success');
                    // Reset button
                    addProductBtn.textContent = originalButtonText;
                    addProductBtn.onclick = addProduct;
                    // Clear form
                    productNameInput.value = '';
                    productPriceInput.value = '';
                    productMoodInput.value = '';
                    productDescriptionInput.value = '';
                    productImageInput.value = '';
                    // Reload products
                    loadProducts();
                } else {
                    showStatus(dataStatus, 'Error updating product', 'error');
                }
            })
            .catch(error => {
                console.error('Error updating product:', error);
                showStatus(dataStatus, 'Connection error', 'error');
            });
        }

        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            // For delete, we need to send the product ID to delete
            // Since our API doesn't have a DELETE endpoint, we'll need to get all products, filter out the one to delete, and save the rest
            const updatedProducts = products.filter(p => p.id !== id);

            fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-key': currentAdminKey
                },
                body: JSON.stringify(updatedProducts)
            })
            .then(response => response.json())
            .then(data => {
                if (data.ok) {
                    showStatus(dataStatus, 'Product deleted successfully!', 'success');
                    loadProducts();
                } else {
                    showStatus(dataStatus, 'Error deleting product', 'error');
                }
            })
            .catch(error => {
                console.error('Error deleting product:', error);
                showStatus(dataStatus, 'Connection error', 'error');
            });
        }

        // Data Management
        function exportProducts() {
            if (!currentAdminKey) return;

            fetch(`${API_BASE}/products`, {
                method: 'GET',
                headers: {
                    'x-admin-key': currentAdminKey
                }
            })
            .then(response => response.json())
            .then(data => {
                const jsonData = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonData], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `luchpuch-products-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus(dataStatus, 'Products exported successfully!', 'success');
            })
            .catch(error => {
                console.error('Error exporting products:', error);
                showStatus(dataStatus, 'Error exporting products', 'error');
            });
        }

        function importProducts() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];
            if (!file) {
                showStatus(dataStatus, 'Please select a JSON file to import', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    if (!Array.isArray(jsonData)) {
                        showStatus(dataStatus, 'Invalid JSON format - expected array of products', 'error');
                        return;
                    }

                    // Validate each product has required fields
                    const validProducts = jsonData.map(p => ({
                        name: p.name || '',
                        price: p.price || 0,
                        mood: p.mood || null,
                        description: p.description || null,
                        image_url: p.image_url || null
                    })).filter(p => p.name && !isNaN(p.price) && p.price >= 0);

                    if (validProducts.length === 0) {
                        showStatus(dataStatus, 'No valid products found in file', 'error');
                        return;
                    }

                    if (confirm(`Import ${validProducts.length} products? This will REPLACE all existing products.`)) {
                        fetch(`${API_BASE}/products`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-admin-key': currentAdminKey
                            },
                            body: JSON.stringify(validProducts)
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.ok) {
                                showStatus(dataStatus, `Successfully imported ${validProducts.length} products!`, 'success');
                                fileInput.value = '';
                                loadProducts();
                            } else {
                                showStatus(dataStatus, 'Error importing products', 'error');
                            }
                        })
                        .catch(error => {
                            console.error('Error importing products:', error);
                            showStatus(dataStatus, 'Connection error', 'error');
                        });
                    }
                } catch (error) {
                    showStatus(dataStatus, 'Invalid JSON file', 'error');
                }
            };
            reader.readAsText(file);
        }

        function clearAllProducts() {
            if (!confirm('Are you sure you want to DELETE ALL PRODUCTS? This cannot be undone!')) return;
            if (!confirm('Type "DELETE" to confirm:') === 'DELETE') return;

            fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',

        // Utility Functions
        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status-message status-${type}`;
            element.style.display = 'block';

            // Hide status after 5 seconds
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        function showTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });

            // Remove active class from all tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(`${tabName}Tab`).classList.add('active');

            // Add active class to clicked button
            event.target.classList.add('active');
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', init);
